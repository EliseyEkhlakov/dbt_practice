unit_tests:
  - name: test_append_one_new_row
    description: "1 строка загружена в модель ранее. Во время обновления должна подгрузитсья одна новая."
    model: stg_flights__bookings_append
    overrides:
      macros:
        is_incremental: true
    given:
      - input: source('demo_src', 'bookings') 
        rows:
          - {book_ref: 00001F, book_date: 2017-01-02}
      - input: this
        rows:
          - {book_ref: 00000F, book_date: 2017-01-02}
    expect:
      rows:
        - {book_ref: 00001F, book_date: 2017-01-02}

  - name: test_init_load_one_row
    description: "Первоначальная загрузка 1 строка"
    model: stg_flights__bookings_append
    overrides:
      macros:
        is_incremental: false
    given:
      - input: source('demo_src', 'bookings') 
        rows:
          - {book_ref: 00001F, book_date: 2017-01-02}

    expect:
      rows:
        - {book_ref: 00001F, book_date: 2017-01-02}        